name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the game data changes rarely: fetched once a week, or when the script changes
      - name: Week of the year
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore game data
        id: gamedata
        uses: actions/cache/restore@v4
        with:
          path: |
            public/items.json
            public/equips.json
          key: gamedata-${{ hashFiles('scripts/fetch-items.ts', 'scripts/equips.ts', 'src/icons.ts', 'src/market/catalog.ts', 'src/market/equipFacts.ts') }}-${{ steps.week.outputs.week }}
      - name: Item names for pictures, equip facts (maplestory.io)
        if: steps.gamedata.outputs.cache-hit != 'true'
        run: npm run items
      # saved only when both files arrived, so a failed fetch is tried again on the next push
      - name: Save game data
        if: steps.gamedata.outputs.cache-hit != 'true' && hashFiles('public/items.json') != '' && hashFiles('public/equips.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            public/items.json
            public/equips.json
          key: ${{ steps.gamedata.outputs.cache-primary-key }}
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Accuracy benchmark (real text reader)
        run: npm run bench
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the site)
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Package the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
